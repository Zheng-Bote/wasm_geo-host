<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flagme-host — Media Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    #map { height: 500px; width: 100%; border-radius: 0.5rem; }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
  <header class="border-b border-gray-800 bg-gray-950 p-4 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <span class="text-2xl">🌍</span>
        <h1 class="text-xl font-bold tracking-tight text-white">flagme-host Media Explorer</h1>
      </div>
      <div class="flex items-center gap-2">
        <input id="searchInput" type="text" placeholder="Search photos (FTS5)..." class="bg-gray-800 border border-gray-700 rounded px-3 py-1.5 text-sm focus:outline-none focus:border-indigo-500 w-64" />
        <button id="searchBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded text-sm font-medium">Search</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 space-y-6">
    <!-- Map Section -->
    <section class="bg-gray-800 p-4 rounded-lg shadow border border-gray-700">
      <h2 class="text-lg font-semibold mb-3 flex items-center gap-2">
        <span>📍</span> Interactive Map View
      </h2>
      <div id="map"></div>
    </section>

    <!-- Gallery Grid Section -->
    <section class="bg-gray-800 p-4 rounded-lg shadow border border-gray-700">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-semibold flex items-center gap-2">
          <span>🖼️</span> Media Gallery
        </h2>
        <span id="photoCount" class="text-sm text-gray-400">Loading...</span>
      </div>
      <div id="galleryGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
        <!-- Rendered photo cards -->
      </div>
    </section>
  </main>

  <script>
    const map = L.map('map').setView([20, 0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let markersLayer = L.layerGroup().addTo(map);

    async function loadMapMarkers() {
      try {
        const res = await fetch('/api/map/markers');
        const data = await res.json();
        markersLayer.clearLayers();

        if (data.features) {
          data.features.forEach(feat => {
            const [lng, lat] = feat.geometry.coordinates;
            const props = feat.properties;
            const marker = L.marker([lat, lng]);
            const popupContent = `
              <div class="text-gray-900 text-sm">
                <strong>${props.filename}</strong><br/>
                ${props.flag || ''} ${props.city || ''}, ${props.country || ''}<br/>
                <a href="/api/photos/${props.id}" target="_blank" class="text-indigo-600 underline">View JSON</a>
              </div>
            `;
            marker.bindPopup(popupContent);
            markersLayer.addLayer(marker);
          });
        }
      } catch (e) {
        console.error('Failed to load map markers:', e);
      }
    }

    async function loadGallery() {
      try {
        const res = await fetch('/api/photos?limit=50');
        const photos = await res.json();
        const grid = document.getElementById('galleryGrid');
        const count = document.getElementById('photoCount');
        count.textContent = `${photos.length} photo(s)`;
        grid.innerHTML = '';

        photos.forEach(doc => {
          const card = document.createElement('div');
          card.className = 'bg-gray-900 border border-gray-700 rounded-lg overflow-hidden flex flex-col p-2';
          const flag = doc.country ? doc.country.flag_emoji : '';
          const locationStr = doc.location ? `${doc.location.city || ''} ${doc.location.country || ''}` : 'No GPS';
          const tags = doc.ai ? doc.ai.tags.slice(0, 2).map(t => `<span class="bg-gray-800 text-xs px-1.5 py-0.5 rounded text-gray-300">#${t.label}</span>`).join(' ') : '';

          card.innerHTML = `
            <div class="h-32 bg-gray-800 flex items-center justify-center text-gray-500 rounded mb-2 text-2xl">
              📷
            </div>
            <div class="text-sm font-semibold truncate text-white">${doc.file.filename}</div>
            <div class="text-xs text-gray-400 truncate">${flag} ${locationStr}</div>
            <div class="mt-2 flex flex-wrap gap-1">${tags}</div>
          `;
          grid.appendChild(card);
        });
      } catch (e) {
        console.error('Failed to load gallery:', e);
      }
    }

    document.getElementById('searchBtn').addEventListener('click', async () => {
      const q = document.getElementById('searchInput').value.trim();
      if (!q) {
        loadGallery();
        return;
      }
      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
        const searchResults = await res.json();
        const grid = document.getElementById('galleryGrid');
        const count = document.getElementById('photoCount');
        count.textContent = `${searchResults.length} match(es) for "${q}"`;
        grid.innerHTML = '';

        searchResults.forEach(r => {
          const card = document.createElement('div');
          card.className = 'bg-gray-900 border border-gray-700 rounded-lg p-3';
          card.innerHTML = `
            <div class="text-sm font-bold text-indigo-400">${r.filename}</div>
            <div class="text-xs text-gray-400">ID: ${r.photo_id}</div>
            <div class="text-xs text-gray-500">BM25 Rank: ${r.rank.toFixed(4)}</div>
          `;
          grid.appendChild(card);
        });
      } catch (e) {
        console.error('Search error:', e);
      }
    });

    loadMapMarkers();
    loadGallery();
  </script>
</body>
</html>

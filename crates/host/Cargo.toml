[package]
name = "flagme-host"
version = "0.2.0"
edition = "2021"
description = "Production-ready WebAssembly Component Media Host"

[[bin]]
name = "flagme-host"
path = "src/main.rs"

[dependencies]
wasm-geo-models = { path = "../models" }
flagme-sdk = { path = "../sdk" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
tracing = "0.1"
anyhow = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
notify = "9.0.0"
tower = { version = "0.5", features = ["util"] }
axum = "0.7"
rust-embed = "8"
tower-http = { version = "0.7.1", features = ["cors", "fs"] }
wasmtime = "51"
# HTTP client of the `http` capability (ADR 0007): rustls (ring) + system certificates, no gzip.
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier"] }
wasmtime-wasi = "51"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[target.'cfg(unix)'.dependencies]
# Safe `geteuid` for the owner check of the component cache directory (ADR 0004).
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
# Plugin crates only for tests of the plugin logic; the host loads plugins as Wasm components (ADR 0003).
flagme-plugin-metadata = { path = "../../plugins/metadata" }
flagme-plugin-reversegeo = { path = "../../plugins/reversegeo" }
flagme-plugin-countryflag = { path = "../../plugins/countryflag" }
flagme-plugin-thumbnail = { path = "../../plugins/thumbnail" }
flagme-plugin-ai-tagging = { path = "../../plugins/ai-tagging" }
flagme-plugin-duplicate = { path = "../../plugins/duplicate" }
flagme-plugin-timeline = { path = "../../plugins/timeline" }
flagme-plugin-weather-enrich = { path = "../../plugins/weather-enrich" }
flagme-plugin-ocr-text = { path = "../../plugins/ocr-text" }
flagme-plugin-face-detection = { path = "../../plugins/face-detection" }
flagme-plugin-privacy-redact = { path = "../../plugins/privacy-redact" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Local TLS server with a self-signed certificate (http-client-rust AC-6).
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

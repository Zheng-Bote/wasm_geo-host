[package]
name = "flagme-sdk"
version = "0.5.0"
edition = "2021"
description = "Plugin SDK for WASM Geo Host plugins"

[dependencies]
wasm-geo-models = { path = "../models" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
wit-bindgen = "0.63"

[workspace]
resolver = "2"
members = [
    "crates/models",
    "crates/sdk",
    "crates/host",
    "plugins/metadata",
    "plugins/reversegeo",
    "plugins/countryflag",
    "plugins/thumbnail",
    "plugins/ai-tagging",
    "plugins/duplicate",
    "plugins/timeline",
    "plugins/weather-enrich",
    "plugins/ocr-text",
    "plugins/face-detection",
    "plugins/privacy-redact",
    "crates/host/tests/probe-plugin",
    "tools/geonames-import",
]

# Compiling the plugin components with an unoptimised Cranelift takes ~10 s per runtime start;
# optimise the compiler crates also in dev/test builds (ADR 0003).
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.cranelift-entity]
opt-level = 3
[profile.dev.package.cranelift-bforest]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3
[profile.dev.package.wasmtime-environ]
opt-level = 3
[profile.dev.package.wasmtime]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3

# Inference in the plugins (ADR 0009): rten is extremely slow unoptimised; optimise it also in
# dev/test builds, like the Cranelift crates above.
[profile.dev.package.rten]
opt-level = 3
[profile.dev.package.rten-gemm]
opt-level = 3
[profile.dev.package.rten-vecmath]
opt-level = 3
[profile.dev.package.rten-simd]
opt-level = 3
[profile.dev.package.rten-tensor]
opt-level = 3
[profile.dev.package.rten-base]
opt-level = 3

# config_mac-studio_64GB.yaml - Mac Studio M5 Max with 64 GB unified memory.
#
# Limits apply per plugin sandbox; each watcher worker runs one plugin at a time, so the peak is
# about workers x largest limit plus ~0.5 GB for the host. Run `flagme-host watch` with
# `--workers 8` (8 x 6 GB = 48 GB, room for the host and the system). Supports 100 MP files
# (maximum of max_pixels) and 2048 px thumbnails of them.
database_path: 'media.db'
# Wasm components of the plugins (ADR 0003): cargo build --release --target wasm32-wasip2 --lib --features component
plugin_dir: 'target/wasm32-wasip2/release'
# Cache for compiled components (ADR 0004): later starts skip compilation; the directory must be writable only by the host user.
component_cache: true
component_cache_dir: 'cache/components'

resource_limits:
  max_memory_bytes: 4294967296 # 4 GB per plugin sandbox
  timeout_ms: 60000

pipeline:
  - metadata
  - image-convert
  - reversegeo
  - countryflag
  - thumbnail
  - ai-tagging
  - duplicate
  - timeline
  - weather-enrich
  - ocr-text
  - face-detection
  - privacy-redact

plugins:
  metadata:
    enabled: true
    capabilities: ['filesystem']
  image-convert:
    # working image for all formats (ADR 0011); the pixel plugins read it
    enabled: true
    capabilities: ['filesystem']
    # 100 MP files: decode, rotate and encode within 6 GB
    resource_limits:
      max_memory_bytes: 6442450944
      timeout_ms: 120000
    settings:
      max_pixels: '100000000'
      quality: '95'
  reversegeo:
    enabled: true
    capabilities: ['http', 'kv']
    settings:
      offline_cache: 'true'
  countryflag:
    enabled: true
    capabilities: []
  thumbnail:
    enabled: true
    capabilities: ['filesystem']
    # 2048 px variants of 100 MP working images
    resource_limits:
      max_memory_bytes: 6442450944
      timeout_ms: 120000
    settings:
      quality: '95'
      variants: '128,256,512,1024,2048'
  ai-tagging:
    # built-in CLIP ViT-B/32 model file, see `make models` (ADR 0010)
    enabled: true
    capabilities: ['filesystem']
    resource_limits:
      max_memory_bytes: 1073741824
      timeout_ms: 30000
    settings:
      max_tags: '8'
  duplicate:
    enabled: true
    capabilities: ['filesystem', 'kv']
    settings:
      phash_threshold: '8'
  timeline:
    enabled: true
    capabilities: ['filesystem']
  weather-enrich:
    enabled: true
    capabilities: ['http', 'kv']
  ocr-text:
    # built-in PaddleOCR PP-OCRv5 engine for Latin script (ADR 0009)
    enabled: true
    capabilities: ['filesystem']
    resource_limits:
      timeout_ms: 60000
    settings:
      max_regions: '500'
  face-detection:
    # built-in YuNet detector (ADR 0009); privacy-redact uses its boxes
    enabled: true
    capabilities: ['filesystem']
    settings:
      min_confidence: '0.80'
  privacy-redact:
    enabled: true
    capabilities: ['filesystem']
    settings:
      style: 'blackout'
      blur_sigma: '24.0'
      fuzz_gps: 'true'
      gps_decimal_places: '4'
      strip_serials: 'true'

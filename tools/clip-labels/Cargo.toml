[package]
name = "clip-labels"
version = "0.5.0"
edition = "2021"
description = "Computes the CLIP text embeddings of the ai-tagging label list (plugins/ai-tagging/labels/labels.bin, ADR 0010)"
publish = false

[[bin]]
name = "clip-labels"
path = "src/main.rs"

[dependencies]
rten = { version = "0.28", default-features = false, features = ["onnx_format"] }
rten-tensor = "0.28"
# Pure-Rust tokenizer (no Oniguruma C library); only used by this native tool, never in a plugin.
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
sha2 = "0.10"

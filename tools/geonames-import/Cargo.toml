[package]
name = "geonames-import"
version = "0.5.0"
edition = "2021"
description = "Builds the reversegeo offline gazetteer (plugins/reversegeo/data/places.bin) from GeoNames dumps (ADR 0006)"
publish = false

[[bin]]
name = "geonames-import"
path = "src/main.rs"

[dev-dependencies]
# Round-trip tests read the written file with the plugin's reader.
flagme-plugin-reversegeo = { path = "../../plugins/reversegeo" }

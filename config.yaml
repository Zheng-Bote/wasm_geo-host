database_path: "media.db"
# Wasm components of the plugins (ADR 0003): cargo build --release --target wasm32-wasip2 --lib --features component
plugin_dir: "target/wasm32-wasip2/release"
# Cache for compiled components (ADR 0004); the directory must be writable only by the host user.
component_cache: true
component_cache_dir: "cache/components"

resource_limits:
  max_memory_bytes: 268435456
  timeout_ms: 10000

pipeline:
  - metadata
  - image-convert
  - reversegeo
  - countryflag
  - thumbnail
  - ai-tagging
  - duplicate
  - timeline
  - weather-enrich
  - ocr-text
  - face-detection
  - privacy-redact

plugins:
  metadata:
    enabled: true
    capabilities:
      - filesystem

  image-convert:
  # working image for all formats (ADR 0011); the pixel plugins read it
    enabled: true
    capabilities:
      - filesystem
    resource_limits:
      max_memory_bytes: 1073741824
      timeout_ms: 30000

  reversegeo:
    enabled: true
    capabilities:
      - http
      - kv

  countryflag:
    enabled: true
    capabilities: []

  thumbnail:
    enabled: true
    capabilities:
      - filesystem
    # Optional per-plugin limits; they replace the global resource_limits, missing fields inherit them.
    # resource_limits:
    #   max_memory_bytes: 1073741824 # 1 GB for large images
    #   timeout_ms: 30000

  ai-tagging:
  # built-in CLIP ViT-B/32 model file, see `make models` (ADR 0010)
    enabled: true
    capabilities:
      - filesystem
    resource_limits:
      max_memory_bytes: 536870912
      timeout_ms: 30000

  duplicate:
    enabled: true
    capabilities:
      - filesystem
      - kv

  timeline:
    enabled: true
    capabilities:
      - filesystem

  weather-enrich:
    enabled: true
    capabilities:
      - http
      - kv

  ocr-text:
  # built-in PaddleOCR PP-OCRv5 engine for Latin script (ADR 0009)
    enabled: true
    capabilities:
      - filesystem
    resource_limits:
      timeout_ms: 30000

  face-detection:
  # built-in YuNet detector (ADR 0009); privacy-redact uses its boxes
    enabled: true
    capabilities:
      - filesystem

  privacy-redact:
    enabled: true
    capabilities:
      - filesystem

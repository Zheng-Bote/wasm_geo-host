database_path: "media.db"

resource_limits:
  max_memory_bytes: 268435456
  timeout_ms: 10000

pipeline:
  - metadata
  - reversegeo
  - countryflag
  - thumbnail
  - ai-tagging
  - duplicate
  - timeline
  - weather-enrich
  - ocr-text
  - face-detection
  - privacy-redact

plugins:
  metadata:
    enabled: true
    capabilities:
      - filesystem

  reversegeo:
    enabled: true
    capabilities:
      - http
      - kv

  countryflag:
    enabled: true
    capabilities: []

  thumbnail:
    enabled: true
    capabilities:
      - filesystem

  ai-tagging:
  # experimental: no engine built in, produces no results (ADR 0002)
    enabled: false
    capabilities:
      - filesystem

  duplicate:
    enabled: true
    capabilities:
      - filesystem
      - kv

  timeline:
    enabled: true
    capabilities:
      - filesystem

  weather-enrich:
    enabled: true
    capabilities:
      - http
      - kv

  ocr-text:
  # experimental: no engine built in, produces no results (ADR 0002)
    enabled: false
    capabilities:
      - filesystem

  face-detection:
  # experimental: no engine built in, produces no results (ADR 0002)
    enabled: false
    capabilities:
      - filesystem

  privacy-redact:
    enabled: true
    capabilities:
      - filesystem

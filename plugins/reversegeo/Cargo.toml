[package]
name = "flagme-plugin-reversegeo"
version = "0.4.0"
edition = "2021"
description = "Dual Online/Offline Reverse Geocoding Plugin for WASM Geo Host"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "flagme-plugin-reversegeo"
path = "src/main.rs"

[features]
# Export the `media-plugin` component (ADR 0003); build with `--lib --features component`.
component = []

[dependencies]
flagme-sdk = { path = "../../crates/sdk" }

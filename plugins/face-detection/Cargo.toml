[package]
name = "flagme-plugin-face-detection"
version = "0.1.0"
edition = "2021"
description = "Face Detection and Clustering Plugin for WASM Geo Host"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "flagme-plugin-face-detection"
path = "src/main.rs"

[features]
# Export the `media-plugin` component (ADR 0003); build with `--lib --features component`.
component = []

[dependencies]
flagme-sdk = { path = "../../crates/sdk" }

[package]
name = "flagme-plugin-face-detection"
version = "0.1.0"
edition = "2021"
description = "Face Detection and Clustering Plugin for WASM Geo Host"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "flagme-plugin-face-detection"
path = "src/main.rs"

[dependencies]
flagme-sdk = { path = "../../crates/sdk" }
serde_json = "1.0"

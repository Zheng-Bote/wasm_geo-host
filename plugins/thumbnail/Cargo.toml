[package]
name = "flagme-plugin-thumbnail"
version = "0.4.0"
edition = "2021"
description = "Multi-Format Deterministic Thumbnail Generation Plugin for WASM Geo Host"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "flagme-plugin-thumbnail"
path = "src/main.rs"

[features]
# Export the `media-plugin` component (ADR 0003); build with `--lib --features component`.
component = []

[dependencies]
flagme-sdk = { path = "../../crates/sdk" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "gif"] }
# AVIF thumbnails (ADR 0012), pinned like the decoder in image-convert (ADR 0011).
oxideav-avif = { version = "=0.0.18", default-features = false, features = ["registry"] }

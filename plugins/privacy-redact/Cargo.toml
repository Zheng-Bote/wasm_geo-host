[package]
name = "flagme-plugin-privacy-redact"
version = "0.3.0"
edition = "2021"
description = "Privacy Redaction and Sanitizing Plugin for WASM Geo Host"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "flagme-plugin-privacy-redact"
path = "src/main.rs"

[features]
# Export the `media-plugin` component (ADR 0003); build with `--lib --features component`.
component = []

[dependencies]
flagme-sdk = { path = "../../crates/sdk" }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
serde_json = "1.0"

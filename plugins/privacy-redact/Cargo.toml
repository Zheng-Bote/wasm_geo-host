[package]
name = "flagme-plugin-privacy-redact"
version = "0.1.0"
edition = "2021"
description = "Privacy Redaction and Sanitizing Plugin for WASM Geo Host"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "flagme-plugin-privacy-redact"
path = "src/main.rs"

[dependencies]
flagme-sdk = { path = "../../crates/sdk" }
serde_json = "1.0"

[package]
name = "flagme-plugin-timeline"
version = "0.2.0"
edition = "2021"
description = "Temporal Normalization and Conflict Resolution Plugin for WASM Geo Host"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "flagme-plugin-timeline"
path = "src/main.rs"

[features]
# Export the `media-plugin` component (ADR 0003); build with `--lib --features component`.
component = []

[dependencies]
flagme-sdk = { path = "../../crates/sdk" }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

[package]
name = "flagme-plugin-duplicate"
version = "0.4.0"
edition = "2021"
description = "Duplicate Detection via SHA256 and Perceptual Hashing for WASM Geo Host"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "flagme-plugin-duplicate"
path = "src/main.rs"

[features]
# Export the `media-plugin` component (ADR 0003); build with `--lib --features component`.
component = []

[dependencies]
flagme-sdk = { path = "../../crates/sdk" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "gif"] }
sha2 = "0.10"

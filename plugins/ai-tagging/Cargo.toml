[package]
name = "flagme-plugin-ai-tagging"
version = "0.5.0"
edition = "2021"
description = "Swappable ONNX Runtime AI Tagging Plugin for WASM Geo Host"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "flagme-plugin-ai-tagging"
path = "src/main.rs"

[features]
# Export the `media-plugin` component (ADR 0003); build with `--lib --features component`.
component = []

[dependencies]
flagme-sdk = { path = "../../crates/sdk" }
# Inference with the CLIP image encoder (ADR 0009, ADR 0010): pure Rust, ONNX format only.
rten = { version = "0.28", default-features = false, features = ["onnx_format"] }
rten-tensor = "0.28"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
sha2 = "0.10"

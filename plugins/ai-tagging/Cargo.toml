[package]
name = "flagme-plugin-ai-tagging"
version = "0.1.0"
edition = "2021"
description = "Swappable ONNX Runtime AI Tagging Plugin for WASM Geo Host"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "flagme-plugin-ai-tagging"
path = "src/main.rs"

[features]
# Export the `media-plugin` component (ADR 0003); build with `--lib --features component`.
component = []

[dependencies]
flagme-sdk = { path = "../../crates/sdk" }

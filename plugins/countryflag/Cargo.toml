[package]
name = "flagme-plugin-countryflag"
version = "0.5.0"
edition = "2021"
description = "Offline Country Database and Flag Emoji Plugin for WASM Geo Host"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "flagme-plugin-countryflag"
path = "src/main.rs"

[features]
# Export the `media-plugin` component (ADR 0003); build with `--lib --features component`.
component = []

[dependencies]
flagme-sdk = { path = "../../crates/sdk" }

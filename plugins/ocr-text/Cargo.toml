[package]
name = "flagme-plugin-ocr-text"
version = "0.4.0"
edition = "2021"
description = "OCR Text Recognition Plugin for WASM Geo Host"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "flagme-plugin-ocr-text"
path = "src/main.rs"

[features]
# Export the `media-plugin` component (ADR 0003); build with `--lib --features component`.
component = []

[dependencies]
flagme-sdk = { path = "../../crates/sdk" }
# Inference with the embedded PP-OCRv5 models (ADR 0009): pure Rust, ONNX format only.
rten = { version = "0.28", default-features = false, features = ["onnx_format"] }
rten-tensor = "0.28"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

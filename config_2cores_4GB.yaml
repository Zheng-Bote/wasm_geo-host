# config_2cores_4GB.yaml - Small machines: 2 CPU cores, 4 GB RAM (small VM, mini PC, NAS).
#
# Limits apply per plugin sandbox; each watcher worker runs one plugin at a time, so the peak is
# about workers x largest limit plus ~0.5 GB for the host. Run `flagme-host watch` with
# `--workers 1` (or `--workers 2` for photos up to 24 MP). Timeouts are longer than in config.yaml
# because inference on two cores is slower.
database_path: 'media.db'
# Wasm components of the plugins (ADR 0003): cargo build --release --target wasm32-wasip2 --lib --features component
plugin_dir: 'target/wasm32-wasip2/release'
# Cache for compiled components (ADR 0004): later starts skip compilation; the directory must be writable only by the host user.
component_cache: true
component_cache_dir: 'cache/components'

resource_limits:
  max_memory_bytes: 268435456 # 256 MB per plugin sandbox
  timeout_ms: 20000

pipeline:
  - metadata
  - image-convert
  - reversegeo
  - countryflag
  - thumbnail
  - ai-tagging
  - duplicate
  - timeline
  - weather-enrich
  - ocr-text
  - face-detection
  - privacy-redact

plugins:
  metadata:
    enabled: true
    capabilities: ['filesystem']
  image-convert:
    # working image for all formats (ADR 0011); the pixel plugins read it
    enabled: true
    capabilities: ['filesystem']
    # 1 GB covers 48 MP HEIC; larger files are rejected before decoding
    resource_limits:
      max_memory_bytes: 1073741824
      timeout_ms: 60000
    settings:
      max_pixels: '50000000'
  reversegeo:
    enabled: true
    capabilities: ['http', 'kv']
    settings:
      offline_cache: 'true'
  countryflag:
    enabled: true
    capabilities: []
  thumbnail:
    enabled: true
    capabilities: ['filesystem']
    settings:
      quality: '80'
      variants: '128,512,1024'
  ai-tagging:
    # built-in CLIP ViT-B/32 model file, see `make models` (ADR 0010)
    enabled: true
    capabilities: ['filesystem']
    resource_limits:
      max_memory_bytes: 536870912
      timeout_ms: 60000
  duplicate:
    enabled: true
    capabilities: ['filesystem', 'kv']
    settings:
      phash_threshold: '10'
  timeline:
    enabled: true
    capabilities: ['filesystem']
  weather-enrich:
    enabled: true
    capabilities: ['http', 'kv']
  ocr-text:
    # built-in PaddleOCR PP-OCRv5 engine for Latin script (ADR 0009)
    enabled: true
    capabilities: ['filesystem']
    resource_limits:
      timeout_ms: 60000
  face-detection:
    # built-in YuNet detector (ADR 0009); privacy-redact uses its boxes
    enabled: true
    capabilities: ['filesystem']
    settings:
      min_confidence: '0.85'
  privacy-redact:
    enabled: true
    capabilities: ['filesystem']
    settings:
      style: 'pixelate'
      block_size: '16'
      fuzz_gps: 'true'
      gps_decimal_places: '2'
      strip_serials: 'true'

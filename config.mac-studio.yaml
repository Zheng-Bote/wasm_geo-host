# config.mac-studio.yaml - High-Performance Profile for Apple Silicon (Mac Studio M-Series, 32GB+ Unified RAM)
database_path: 'media.db'
# Wasm components of the plugins (ADR 0003): cargo build --release --target wasm32-wasip2 --lib --features component
plugin_dir: 'target/wasm32-wasip2/release'

resource_limits:
  max_memory_bytes: 4294967296 # 4 GB per plugin sandbox
  timeout_ms: 60000 # 60s timeout for ultra-high-resolution files

pipeline:
  - metadata
  - reversegeo
  - countryflag
  - thumbnail
  - ai-tagging
  - duplicate
  - timeline
  - weather-enrich
  - ocr-text
  - face-detection
  - privacy-redact

plugins:
  metadata:
    enabled: true
    capabilities: ['filesystem']
  reversegeo:
    enabled: true
    capabilities: ['http', 'kv']
    settings:
      offline_cache: 'true'
  countryflag:
    enabled: true
    capabilities: []
  thumbnail:
    enabled: true
    capabilities: ['filesystem']
    settings:
      quality: '95'
      variants: '128,256,512,1024,2048'
  ai-tagging:
    # experimental: no engine built in, produces no results (ADR 0002)
    enabled: false
    capabilities: ['filesystem']
    settings:
      embedding_dim: '512'
  duplicate:
    enabled: true
    capabilities: ['filesystem', 'kv']
    settings:
      phash_threshold: '8'
  timeline:
    enabled: true
    capabilities: ['filesystem']
  weather-enrich:
    enabled: true
    capabilities: ['http', 'kv']
  ocr-text:
    # experimental: no engine built in, produces no results (ADR 0002)
    enabled: false
    capabilities: ['filesystem']
  face-detection:
    # experimental: no engine built in, produces no results (ADR 0002)
    enabled: false
    capabilities: ['filesystem']
    settings:
      min_confidence: '0.80'
  privacy-redact:
    enabled: true
    capabilities: ['filesystem']
    settings:
      style: 'blackout'
      blur_sigma: '24.0'
      fuzz_gps: 'true'
      gps_decimal_places: '4'
      strip_serials: 'true'
